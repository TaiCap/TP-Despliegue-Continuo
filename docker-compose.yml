services:

  # ============================================================
  # BASE DE DATOS - MYSQL
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: docker-tp-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      # Volumen para conservar los datos de MySQL
      - mysql_data:/var/lib/mysql

      # Script inicial de creación de tablas y datos
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      # Verifica que MySQL esté listo para aceptar conexiones
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - docker_tp_network


  # ============================================================
  # BACKEND - FASTAPI
  # ============================================================
  backend:
    build:
      # Directorio donde se encuentra el Dockerfile del backend
      context: ./backend
      dockerfile: Dockerfile

    container_name: docker-tp-backend

    environment:
      # Variables utilizadas por FastAPI para conectarse a MySQL
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_HOST: mysql
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    depends_on:
      # FastAPI espera a que MySQL esté saludable
      mysql:
        condition: service_healthy

    ports:
      # Puerto de la PC : puerto del contenedor
      - "${BACKEND_PORT}:8000"

    networks:
      - docker_tp_network


  # ============================================================
  # FRONTEND - NGINX
  # ============================================================
  frontend:
    build:
      # Directorio donde se encuentra el Dockerfile del frontend
      context: ./frontend
      dockerfile: Dockerfile

    container_name: docker-tp-frontend

    depends_on:
      # El frontend se inicia después del backend
      - backend

    ports:
      # Puerto de la PC : puerto del contenedor
      - "${FRONTEND_PORT}:80"

    networks:
      - docker_tp_network


# ============================================================
# VOLUMEN
# ============================================================
volumes:
  mysql_data:


# ============================================================
# RED
# ============================================================
networks:
  docker_tp_network:
    driver: bridge